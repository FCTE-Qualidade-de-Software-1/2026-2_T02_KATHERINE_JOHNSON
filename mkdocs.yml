site_name: Portal × Aplicativo na consulta de infrações do Detran-DF
site_description: Projeto Final de FGA0315 Qualidade de Software 1 (UnB/FGA, 2026/2) — equipe Katherine Johnson
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_KATHERINE_JOHNSON/
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_KATHERINE_JOHNSON
repo_name: Repositório no GitHub
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  font: false
  icon:
    logo: material/chart-timeline-variant-shimmer
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro

extra_css:
  - assets/stylesheets/visual.css

# Renderiza os diagramas clicáveis da cadeia (bloco ```mermaid-cadeia) na Início.
extra_javascript:
  - assets/javascripts/cadeia.js

# Links e âncoras quebrados viram aviso; com `mkdocs build --strict`, o build falha.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

# Versão exibida no rodapé de todas as páginas; atualizar a cada release.
extra:
  versao: "2.0 (Entrega 2)"
  generator: false

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # Diagrama com nós clicáveis; o Material não o processa (ver cadeia.js).
        - name: mermaid-cadeia
          class: kj-cadeia
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pt

# Ao adicionar uma página nova em docs/, incluí-la aqui na seção correspondente.
nav:
  - Início: index.md
  - Metodologia: metodologia.md
  - Rastreabilidade: rastreabilidade.md
  - Fase 1:
      - Visão geral: fase1.md
      - Propósito, partes interessadas e escopo: fase1-proposito.md
      - Produto e modelo de qualidade: fase1-produto.md
      - Priorização, cobertura de contexto e ODS: fase1-priorizacao.md
  - Fase 2:
      - Visão geral: fase2.md
      - Objetivos, questões e hipóteses: fase2-gqm.md
      - Métricas, níveis e critérios de julgamento: fase2-metricas.md
  - Fase 3:
      - Visão geral: fase3.md
      - Método e instruções para o avaliador: fase3-metodo.md
      - Recursos e ambiente: fase3-ambiente.md
      - Massa e instrumentos de coleta: fase3-dados.md
      - Cronograma e bloqueios: fase3-cronograma.md
  - Fase 4:
      - Visão geral: fase4.md
      - Coleta, pendências e cálculo: fase4-coleta.md
      - Medições por métrica: fase4-medicoes.md
      - Análise e julgamento GQM: fase4-analise.md
      - Ação de melhoria: fase4-melhoria.md
  - Gestão (PSM/CID):
      - Medições e decisões: gestao.md
      - Registro de horas por issue: gestao-horas.md
      - Fechamento documental da E2: gestao-fechamento-e2.md
      - Quadro do backlog (acesso restrito): https://github.com/orgs/FCTE-Qualidade-de-Software-1/projects/38
  - Atas: atas.md
  - Equipe: equipe.md
  - Declaração de IA: declaracao-ia.md
