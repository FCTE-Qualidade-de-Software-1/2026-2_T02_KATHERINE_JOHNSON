name: Validar instrumentos da coleta

on:
  pull_request:
    paths:
      - 'dados/**'
      - 'evidencias/fase4/**'
      - '.github/workflows/coleta.yml'
  push:
    branches: [main]
    paths:
      - 'dados/**'
      - 'evidencias/fase4/**'
      - '.github/workflows/coleta.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s dados/tests -v
      - run: python3 dados/scripts/calcular.py --validar
